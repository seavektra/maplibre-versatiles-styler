name: SeaVektra release

# Builds the SeaVektra fork for ChartManager and attaches the bundle to a GitHub release.
# Started by a tag v<upstream version>-sv.<n>, e.g. v3.0.2-sv.1. Nothing is published to npm.
# ChartManager vendors the asset with scripts/update-versatiles-styler.sh <tag>.

on:
  push:
    tags:
      - 'v*-sv.*'

permissions:
  contents: write # GitHub release

concurrency:
  group: seavektra-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Check, build and release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, typecheck, lint and run unit tests
        run: npm run check:release

      - name: Build
        run: npm run build

      # The release may already exist when the tag was created from the GitHub UI's "Draft a new
      # release" form; then only the bundle is uploaded.
      - name: Create the GitHub release and upload the bundle
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "SeaVektra build of maplibre-versatiles-styler. See SEAVEKTRA.md." \
            --prerelease \
            --verify-tag
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/maplibre-versatiles-styler.js \
            dist/maplibre-versatiles-styler.d.ts
